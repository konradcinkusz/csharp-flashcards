name: Secret Scan

# ─────────────────────────────────────────────────────────────────────────────
#  Secret scanning — the CI half of a two-part control.
#
#      developer machine                    GitHub
#      ┌──────────────────────┐             ┌──────────────────────────┐
#      │ scripts/hooks/       │             │ this workflow            │
#      │   pre-commit         │             │   • full git history     │
#      │   • staged changes   │  ────────▶  │   • every PR and push    │
#      │   • blocks the commit│             │   • weekly, on schedule  │
#      └──────────────────────┘             └──────────────────────────┘
#        catches the mistake                  catches contributors
#        before it is history                 without hooks
#
#  REPO-BASELINE.md §2 makes both halves mandatory and explains why either alone
#  leaves a gap.
#
#  The obvious objection to scanning a LaTeX deck is that it holds no
#  credentials. True today, and not the argument. 197 of its frames carry code
#  listings and it covers OAuth, Azure, Docker, CI/CD and Terraform — so the
#  realistic accident is an appsettings.json fragment or an `az` command line
#  pasted into a card with a live key still in it. This repository is public, so
#  that commit is disclosed the moment it is pushed.
#
#  Why the scanner image is :latest, deliberately, against the usual pinning
#  rule. A detection ruleset is only worth what its newest rule catches, and a
#  pinned scanner silently stops detecting whatever was added upstream last
#  month. The trade — a scanner that can change under us — buys detection that
#  does not decay. Everything else here is pinned.
#
#  The weekly run exists because rules are added upstream continuously: a commit
#  that was clean in March can be a finding in June, and nobody re-scans history
#  on their own initiative.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']
  schedule:
    # Mondays 05:30 UTC. Deliberately not colliding with Dependabot's window
    # (#26), so a rule-set finding is not confused with a dependency bump.
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is load-bearing. The default shallow clone scans only
          # the tip commit, so a secret added and then removed in an earlier
          # commit of the same branch would pass — which is precisely the case
          # this job exists to catch, since the secret is still in history.
          fetch-depth: 0

      - name: Scan
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/gitleaks/gitleaks:latest"

          # gitleaks renamed `detect` to `git` in v8.19 and kept the old name as
          # a deprecated alias. Probe instead of assuming, so a scanner upgrade
          # does not turn this job red for the wrong reason.
          if docker run --rm "$IMAGE" git --help >/dev/null 2>&1; then
            SUB=(git /repo)
          else
            SUB=(detect --source=/repo)
          fi

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            "${SUB[@]}" \
              --config=/repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --verbose \
              --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Secret scan failed

          A credential-shaped string was found in this repository's history.

          **This repository is public.** A pushed commit is disclosed the moment
          it is pushed, so the order of operations is not negotiable:

          1. **Rotate the credential.** Now, before anything else.
          2. Remove it from the source; read it from the environment instead.
          3. Only then clean history.

          Scrubbing without rotating is theatre — REPO-BASELINE.md §2.

          The likeliest cause here is a code listing in an `areas/*.tex` card
          with a real key left in it. The fix is a placeholder, not an allowlist.

          If it genuinely is a false positive, add a **narrow** entry to
          `.gitleaks.toml` scoped by path, with a comment saying why. Never
          allowlist a finding by pasting the real value into a regex.

          Reproduce locally: `./scripts/scan-secrets.sh`
          SUMMARY
